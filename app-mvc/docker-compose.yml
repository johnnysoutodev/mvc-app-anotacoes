services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: senai
      POSTGRES_PASSWORD: senai123
      POSTGRES_DB: anotacoes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
